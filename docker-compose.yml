services:
  nlp-proxy:
    build: ./nlp-proxy
    ports:
      - "5000:5000"
    volumes:
      - ./nlp-logs:/var/log/nlp-proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

