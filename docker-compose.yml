services:
  nlp-proxy:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./nlp-logs:/var/log/nlp-proxy
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: nlp-proxy_default
